<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>choir</title>
<meta name="description" content="Play a melody. A four-part choir harmonizes every note as you press it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=IBM+Plex+Mono&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<link rel="stylesheet" href="site-tokens.css">
<link rel="stylesheet" href="choir.css">
<script>
  // the coin's face, as the site remembers it (the obverse is the absence of a choice)
  try { if (localStorage.getItem('theme') === 'reverse') document.documentElement.dataset.theme = 'reverse'; } catch {}
</script>
</head>
<body>
<main class="page">
  <header class="page-header">
    <p class="kicker">an instrument</p>
    <h1>choir</h1>
    <button type="button" class="coin" id="coin">turn the coin</button>
  </header>

  <div id="choir" data-vis-mask=""></div>

  <p class="caption">
    Each note gets its chord as you play it, from the voice-leading rules in
    <a href="https://github.com/DashWieland/choral-counterpoint">choral-counterpoint</a>, the engine behind the
    <a href="https://apophenia.blog/work/choral-hurdy-gurdy">Choral Hurdy-Gurdy</a>. Plays on screen, or on an
    original Launchpad Mini in Chrome. <a href="https://github.com/DashWieland/instrument-novation-launchpad">Source</a>.
  </p>
</main>
<script type="module">
  import { mountChoir } from './mount.js';
  const handle = mountChoir(document.getElementById('choir'), { recording: true });
  window.choir = handle.debug;
  document.getElementById('coin').onclick = () => {
    const el = document.documentElement, reverse = el.dataset.theme !== 'reverse';
    if (reverse) el.dataset.theme = 'reverse'; else delete el.dataset.theme;
    try { reverse ? localStorage.setItem('theme', 'reverse') : localStorage.removeItem('theme'); } catch {}
    handle.retheme();
  };
</script>
</body>
</html>
